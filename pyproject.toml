[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlaudified"
version = "0.0.0"
description = "Claude Code plugin that tracks where each claim came from and whether its qualifiers survived."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # core is standard library only

[project.optional-dependencies]
web = []  # main-text extraction for shadow re-fetch; chosen in Sprint 3 (CAP-3)
nli = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy"]  # tier 2 verifier (VER-3)
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
qlaudified-sim = "qlaudified.testing.sim:main"

[tool.setuptools.packages.find]
include = ["qlaudified*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: starts a real claude -p session (uses plan usage)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["spike"]

[tool.mypy]
python_version = "3.10"
packages = ["qlaudified"]
ignore_missing_imports = true
