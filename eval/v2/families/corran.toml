# Corran Logistics: freight and warehousing. Study v2 task families (methods critique, fixes 4, 5).

org = "Corran Logistics"

[distractors]
"driver-survey.md" = """
# Driver survey results

The annual driver survey closed on September 15 with 318 responses, a 72% response rate. Drivers
rated route planning 3.8 out of 5, up from 3.4 last year, after the new dispatch app replaced paper
manifests.

The most common complaint was waiting time at customer docks. The operations team has asked the
five busiest customers to share their dock schedules a day in advance. Rest-area access on the
northern routes also came up often; two new partner truck stops were added in August.

Results by depot will be shared with depot managers next week, and each depot will pick two
improvements to work on before the spring survey.
"""
"cyber.md" = """
# Information security update

Phishing simulation click rates fell to 4.1% in Q3 from 9.7% at the start of the year. All office
staff completed the new security awareness module; warehouse staff will follow in October using
shorter tablet-based lessons.

The firewall replacement at the Leeds hub finished on August 19. Two minor vulnerabilities found in
the customer portal's penetration test were fixed within the agreed 30 days. Multi-factor sign-in
now covers 96% of user accounts; the rest are shared scanner accounts that the team is replacing
with individual logins.
"""
"sustainability.md" = """
# Sustainability notes

Corran's electric van pilot in the city centre completed its sixth month. The 20 vans covered about
212,000 kilometres with no missed rounds caused by charging. Drivers asked for more cargo shelving,
which the leasing company will fit in November.

Solar panels on the Leeds hub roof produced 410 megawatt-hours over the summer, covering roughly a
third of the site's daytime electricity. The packaging team switched two customer accounts to
reusable crates, removing about 9 tonnes of cardboard a month.
"""
"customer-desk.md" = """
# Customer service desk

The service desk handled 14,800 contacts in Q3. First-contact resolution was 81%, and the average
email reply time was 3.2 hours. Chat was added to the customer portal in July and now takes about a
fifth of all contacts.

The desk lost two experienced agents to retirement this quarter. Their replacements finished
training in September. The team lead wants to add weekend chat coverage, which would need 1.5 more
staff, and will bring a proposal to the November budget round.
"""
"training-academy.md" = """
# Corran Academy

The driver academy graduated 46 new drivers in Q3, the largest cohort so far. The pass rate on the
first attempt at the practical test was 89%. Forklift certification courses ran at all three hubs,
with 120 warehouse staff certified or recertified.

Simulator time was increased from 6 to 8 hours per trainee after instructors noticed that new
drivers struggled with reversing into narrow docks. The academy's next intake starts on November 3.
"""
"fleet-maintenance.md" = """
# Fleet maintenance

Planned maintenance compliance reached 97% in Q3. Tyre spend was $286,000, about the same as Q2.
The workshop trialled a new brake-pad supplier on 40 trucks; wear so far is similar to the old
supplier at a lower price.

Two older rigid trucks were retired after failing their annual inspection. The workshop's parts
inventory was counted in September and matched the system within 0.4%.
"""
"social-club.md" = """
# Social club

The summer barbecue at the Leeds hub drew about 260 staff and family members. The five-a-side
football league finished with the night-shift team winning for the second year running.

The club is planning a quiz night in November and a family day at the depot in December, with
truck tours for children. Volunteers for the December event can sign up with the club secretary.
"""
"compliance.md" = """
# Regulatory compliance

All 208 heavy goods vehicles hold valid operator licences. Roadside checks in Q3 found three minor
defects, all fixed on the spot. Drivers' hours compliance was 99.1% across the fleet, measured from
tachograph data.

The transport manager will attend the regulator's annual briefing in October, where changes to
driver-hours recording rules are expected to be discussed.
"""

"operating-report.md" = """
# Corran Logistics: quarterly operating report

## Volumes

Corran moved 1.42 million pallets in the quarter across its three hubs, about level with the same
quarter last year. Parcel volumes from e-commerce customers grew faster: 3.9 million parcels, up
from 3.3 million. The Leeds hub handled 46% of all pallet movements; Bristol and Glasgow shared the
rest roughly evenly.

## Network

The linehaul network ran 1,960 trunk routes a week on average. Trailer fill improved to 78% from
74% after the planning team combined several low-volume routes between Bristol and South Wales.
Empty running, the share of kilometres driven without a load, fell to 17.2%.

Two subcontracted hauliers were replaced after repeated missed collection windows. Subcontractors
now carry 22% of trunk volume, down from 27% at the start of the year, as Corran's own fleet grew
by 18 tractor units.

## Customers

Corran signed four new contract customers in the quarter, the largest a home-furnishings retailer
expected to add around 9,000 pallets a month from spring. The retailer's volumes depend on its new
store openings, which have not all been confirmed. Customer satisfaction, measured in the
quarterly account survey, scored 8.1 out of 10. Two customers gave notice: one moving its
distribution in-house, the other consolidating with a rival after a takeover.

## Finance

Revenue for the quarter was $57.3M and operating profit was $4.25M, a margin of 7.4%. Staff costs
rose 6% after the annual pay award took effect in July. Capital spending was $2.9M, mostly on
tractor units and the Glasgow yard extension. Net debt at the end of the quarter stood at $21.6M.

## Safety

The lost-time injury rate was 0.62 per 100,000 hours worked, the lowest Corran has recorded. Two
reportable incidents occurred at the Bristol hub, both involving pallet trucks, and the hub has
since changed its pedestrian walkways. Vehicle collisions per million kilometres fell to 1.9.

## Outlook

For the next quarter, Corran expects volumes to rise seasonally, with the peak in late November and
early December. Temporary staffing plans cover about 240 extra warehouse shifts a week at the peak.
"""

