"roads.md" = """
# Highways: road repairs

The council fixed 4,820 potholes between April and September, and spent $2.15M on road repairs in
that period.

For the full financial year, spending is projected to reach roughly $4.4M, assuming no severe
winter. The highways team also hopes to resurface about 38 kilometres of road, though only 21
kilometres have been resurfaced so far.
"""
